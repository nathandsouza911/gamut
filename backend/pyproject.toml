[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamut"
version = "0.1.0"
description = "GAMUT: a self-hosted web admin panel for Google Workspace, powered by GAM7"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "cryptography>=43",
  "authlib>=1.3",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "gam7==7.52.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
gamut = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/pytest_cache"
filterwarnings = [
  # Starlette's TestClient now prefers the httpx2 package; httpx still works and is what
  # Authlib uses at runtime, so this test-only deprecation notice is silenced.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
cache_dir = "/tmp/mypy_cache"

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[[tool.mypy.overrides]]
# Authlib ships no type information.
module = ["authlib.*"]
ignore_missing_imports = true
